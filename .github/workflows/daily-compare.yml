name: Daily TractorJunction vs VMS compare

on:
  schedule:
    # Must finish before 10:00 IST. GitHub delays or drops scheduled runs, most
    # often on the hour, so use off-the-hour minutes and a backup slot:
    # 03:17 UTC = 08:47 IST, backup 03:41 UTC = 09:11 IST (skipped by the guard
    # job when the first one already ran).
    - cron: '17 3 * * *'
    - cron: '41 3 * * *'
  workflow_dispatch:

# Least privilege: the job only needs to read the code.
permissions:
  contents: read

concurrency:
  group: daily-compare
  cancel-in-progress: false

jobs:
  # Skip a scheduled run when an earlier scheduled run today already succeeded or
  # is still going, so the backup slot only runs if the first one was dropped or failed.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Only earlier runs count, so the first run of the day never skips itself.
          url="repos/${{ github.repository }}/actions/workflows/daily-compare.yml/runs?event=schedule&created=$(date -u +%F)&per_page=20"
          n=$(gh api "$url" --jq '[.workflow_runs[] | select(.id < ${{ github.run_id }}) | select(.conclusion == "success" or .status != "completed")] | length')
          echo "Earlier scheduled runs today (success or active): $n"
          if [ "$n" -gt 0 ]; then echo run=false >> "$GITHUB_OUTPUT"; else echo run=true >> "$GITHUB_OUTPUT"; fi

  compare:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VMS_API_BASE: ${{ secrets.VMS_API_BASE }}
      PROD_VMS_TOKEN: ${{ secrets.PROD_VMS_TOKEN }}
      ZOHO_ACCOUNTS_DC: ${{ secrets.ZOHO_ACCOUNTS_DC }}
      CLIQ_API_BASE: ${{ secrets.CLIQ_API_BASE }}
      CLIQ_CLIENT_ID: ${{ secrets.CLIQ_CLIENT_ID }}
      CLIQ_CLIENT_SECRET: ${{ secrets.CLIQ_CLIENT_SECRET }}
      CLIQ_REFRESH_TOKEN: ${{ secrets.CLIQ_REFRESH_TOKEN }}
      ZOHO_CLIQ_CHANNEL: ${{ secrets.ZOHO_CLIQ_CHANNEL }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
      SHEET_WEBAPP_SECRET: ${{ secrets.SHEET_WEBAPP_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The TJ DB is office-network only, so the location map (exported with
      # npm run location:export) comes from a secret instead.
      - name: Restore location map
        env:
          LOCATION_MAP_GZ_B64: ${{ secrets.LOCATION_MAP_GZ_B64 }}
        run: printf '%s' "$LOCATION_MAP_GZ_B64" | base64 -d | gunzip > data/location-map.json

      - name: Warn in Cliq if the VMS token expires within 3 days
        continue-on-error: true
        run: |
          node --input-type=module -e "
            const t = (process.env.PROD_VMS_TOKEN || '').replace(/^Bearer\s+/i, '');
            const exp = JSON.parse(Buffer.from(t.split('.')[1] || 'e30', 'base64url').toString()).exp;
            const days = exp ? (exp * 1000 - Date.now()) / 86400000 : Infinity;
            if (days < 3) {
              const { notify } = await import('./auth/zoho-cliq.js');
              await notify('⚠️ VMS token for the daily TractorJunction vs VMS compare ' + (days <= 0 ? 'has EXPIRED' : 'expires in ' + days.toFixed(1) + ' days') + ' — update the PROD_VMS_TOKEN GitHub secret.');
            }
          "

      # Live scan of the site + VMS, then replaces the Google Sheet tabs and posts
      # the summary to Cliq. Output files hold VMS lead data, so they are never
      # uploaded as artifacts (artifacts of a public repo are public).
      - name: Run compare, update sheet, post to Cliq
        run: npm run daily:tractor-vs-vms

      - name: Notify Cliq on failure
        if: failure()
        run: node auth/zoho-cliq.js notify "❌ Daily TractorJunction vs VMS compare failed — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
